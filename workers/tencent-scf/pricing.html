<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveBot 会员套餐</title>
<style>
  :root {
    --bg: #161823;
    --card: #252733;
    --border: #3A3C4A;
    --accent: #FE2C55;
    --text: #fff;
    --text2: #8A8B99;
    --gold: #FFD700;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 0;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .pricing-page {
    padding: 0;
  }

  /* 当前状态区域 */
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .status-bar .label { color: var(--text2); font-size: 12px; }
  .status-bar .value {
    font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 4px;
  }
  .tier-free { background: linear-gradient(135deg, #FFD700, #FF8C00); color: #000; }
  .tier-vip  { background: linear-gradient(135deg, #FFD700, #FFA000); color: #000; }

  .expiry-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .expiry-row .label { color: var(--text2); }

  /* ====== 套餐区域 — 修改价格只需改下面 ====== */
  .section-title {
    font-size: 13px; font-weight: 700; margin: 16px 0 8px;
    color: var(--gold);
  }

  .plan-list { display: flex; flex-direction: column; gap: 5px; }

  .plan-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .plan-item.recommend {
    border-color: var(--gold);
    box-shadow: 0 0 8px rgba(255,215,0,0.15);
  }
  .plan-main { font-size: 14px; font-weight: 700; color: var(--accent); }
  .plan-tag {
    font-size: 10px; padding: 2px 6px; border-radius: 3px;
    background: rgba(255,215,0,0.15); color: var(--gold);
    margin-left: 6px;
  }
  .plan-note { font-size: 11px; color: var(--text2); }

  /* 联系方式 */
  .contact-area {
    margin-top: 14px; padding: 8px 10px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; color: var(--text2);
    text-align: center;
  }
  /* ====== 套餐区域结束 ====== */

  .foot-note {
    margin-top: 10px; font-size: 10px; color: var(--text2);
    text-align: center; opacity: 0.6;
  }
</style>
</head>
<body>
<div class="pricing-page">

  <div class="status-bar">
    <span class="label">当前状态</span>
    <span class="value" id="tier-badge">免费版</span>
  </div>
  <div class="expiry-row" id="expiry-row" style="display:none">
    <span class="label">到期时间</span>
    <span id="expiry-text">-</span>
  </div>

  <!-- ═══════════════ 套餐价格 ═══════════════ -->
  <div class="section-title">套餐价格</div>
  <div class="plan-list">
    <div class="plan-item">
      <div><span class="plan-main">1个月 — ¥99</span></div>
      <span class="plan-note">短期体验</span>
    </div>
    <div class="plan-item">
      <div><span class="plan-main">1个季度 — ¥199</span></div>
      <span class="plan-note">日常运营</span>
    </div>
    <div class="plan-item recommend">
      <div><span class="plan-main">1年 — ¥699</span><span class="plan-tag">⭐推荐</span></div>
      <span class="plan-note">长期使用</span>
    </div>
  </div>

  <div class="contact-area">
    📧 微信: xxx &nbsp;|&nbsp; 邮箱: 1361098634@qq.com
  </div>
  <!-- ═══════════════ 套餐结束 ═══════════════ -->
</div>

<script>
  // 从父窗口 (扩展) 接收 tier/expiry 并更新显示
  window.addEventListener('message', function(e) {
    if (!e.data || e.data.source !== 'livebot-sidebar') return;
    var badge = document.getElementById('tier-badge');
    var row = document.getElementById('expiry-row');
    var txt = document.getElementById('expiry-text');

    if (e.data.tier === 'vip') {
      badge.textContent = 'VIP会员';
      badge.className = 'value tier-vip';
      if (e.data.expiry) {
        row.style.display = 'flex';
        txt.textContent = new Date(e.data.expiry).toLocaleDateString('zh-CN');
      }
    } else {
      badge.textContent = '免费版';
      badge.className = 'value tier-free';
      row.style.display = 'none';
    }
  });

  // 通知父窗口已就绪
  window.parent.postMessage({ source: 'livebot-pricing', ready: true }, '*');
</script>
</body>
</html>
